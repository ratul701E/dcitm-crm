name: Production CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.prettierrc'
      - 'eslint.config.mjs'
      - 'Plan.md'
      - 'README.md'
      - 'README.docker.md'
      - 'scripts/backup.*'
      - 'scripts/restore.*'
      - 'scripts/check_db.js'
  workflow_dispatch:
    inputs:
      target:
        description: 'Component to deploy'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - backend
          - frontend
          - all

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Google Cloud VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure SSH Key & Host Verification
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::Secret VPS_SSH_KEY is empty or not configured in GitHub Secrets!"
            exit 1
          fi

          if [ -z "$VPS_HOST" ]; then
            echo "::error::Secret VPS_HOST is empty or not configured in GitHub Secrets!"
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Install dedicated deployment private key (cleaning carriage returns)
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # Secure host verification via ssh-keyscan (prevents man-in-the-middle attacks without blind StrictHostKeyChecking=no)
          echo "Scanning SSH host keys for $VPS_HOST:$VPS_PORT..."
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 644 ~/.ssh/known_hosts

      - name: Execute Deployment on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          TARGET: ${{ github.event.inputs.target || 'auto' }}
        run: |
          echo "Connecting to $VPS_HOST:$VPS_PORT as user $VPS_USER..."
          echo "Deployment Target: $TARGET"
          
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "bash -lc '
            set -e
            if [ -x /var/www/crm/deploy.sh ]; then
              /var/www/crm/deploy.sh \"$TARGET\"
            elif [ -x /var/www/crm/dcitm-crm/scripts/deploy.sh ]; then
              /var/www/crm/dcitm-crm/scripts/deploy.sh \"$TARGET\"
            else
              echo \"::error::Deployment script not found or not executable at /var/www/crm/deploy.sh or /var/www/crm/dcitm-crm/scripts/deploy.sh\" >&2
              exit 1
            fi
          '"

      - name: Display Stack Status & Health
        if: success()
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "bash -lc '
            if [ -x /var/www/crm/deploy.sh ]; then
              /var/www/crm/deploy.sh status
            elif [ -x /var/www/crm/dcitm-crm/scripts/deploy.sh ]; then
              /var/www/crm/dcitm-crm/scripts/deploy.sh status
            fi
          '"
